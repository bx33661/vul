name: Research correction
description: Report an inaccurate version, reference, reproduction detail, or mitigation.
title: "[Correction] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the accuracy of this research.
  - type: input
    id: section
    attributes:
      label: Affected section
      placeholder: README section, file path, or line number
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current statement or behavior
      description: Describe what is inaccurate or incomplete.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: Include reproducible evidence or primary references where possible.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This report does not contain credentials, tokens, or private target information.
          required: true
